name: Test profile statistics

on:
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
