name: Update README

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - assets/*-calendar*.svg
      - assets/profile-activity*.svg
      - assets/activity-daily.md
      - site/data.json

# Includes deployment: an older scan cannot deploy after a newer scan.
concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publish_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify contribution statistics
        run: python3 -m unittest discover -s tests -v
      - name: Collect and render one public snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_activity.py
      - name: Commit the complete generation
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-activity.svg assets/profile-activity-mobile.svg assets/activity-daily.md site/data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh public activity notebook [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes do not trigger another push workflow. Deploy explicitly.
  deploy:
    needs: update-readme
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      publish_sha: ${{ needs.update-readme.outputs.publish_sha }}
